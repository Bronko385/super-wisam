<title>Super Wisam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap">
<style>
/* Layout: ein Vollbild-Canvas (Kellerbar bei Nacht), Touch-Tasten unten, Overlays mittig. Bewusst nur dunkles Theme. */
:root{
  --bg:#15111a; --wall:#2a2430; --neon:#c46bff; --amber:#f0a43a; --ink:#f4ede4; --muted:#b3a7bf; --panel:#1f1926;
  --f-display:'Bungee',Impact,'Arial Black',sans-serif;
  --f-pixel:'Press Start 2P',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-pixel)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:grid;place-items:safe center;overflow-y:auto;padding:16px;background:rgba(10,7,14,.74);z-index:5}
.card{width:min(420px,100%);box-sizing:border-box;text-align:center;display:grid;gap:18px;justify-items:center;padding:28px 20px;background:var(--panel);border:2px solid var(--amber);box-shadow:0 0 0 4px var(--bg),0 0 44px rgba(196,107,255,.35)}
.face{width:104px;height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,11vw,56px);line-height:.95;color:var(--amber);text-shadow:0 0 18px rgba(196,107,255,.85),3px 3px 0 #5a2a7a;margin:0;text-wrap:balance}
.title.small{font-size:clamp(26px,8vw,38px)}
.lead{margin:0;font-size:11px;line-height:1.9;color:var(--ink);max-width:32ch}
.score{margin:0;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums}
.keys{margin:0;font-size:9px;line-height:1.9;color:var(--muted)}
.btn{font-family:var(--f-pixel);font-size:14px;padding:16px 26px;background:var(--amber);color:#1a1008;border:0;box-shadow:0 5px 0 #8a5a18;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn.ghost{background:transparent;color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--amber)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a18}
.btn:focus-visible,.cbtn:focus-visible,.mute:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:16px 22px calc(22px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:4}
.pad{display:flex;gap:16px}
.cbtn{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:2px solid rgba(244,237,228,.35);background:rgba(244,237,228,.10);color:var(--ink);font-size:24px;display:grid;place-items:center;touch-action:none;padding:0;font-family:var(--f-pixel)}
.cbtn.jump{width:92px;height:92px;border-color:var(--amber);background:rgba(240,164,58,.20);color:var(--amber);font-size:12px}
.cbtn.on{background:rgba(240,164,58,.5);border-color:var(--amber);color:var(--ink)}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;width:40px;height:40px;border-radius:50%;border:2px solid rgba(244,237,228,.3);background:rgba(21,17,26,.6);color:var(--ink);font-size:16px;cursor:pointer;padding:0}
.mute.off{color:var(--muted);text-decoration:line-through}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.prize{width:128px;height:auto;animation:bob 1.6s ease-in-out infinite reverse}
@media (max-height:520px){.prize{width:84px}.card{gap:10px;padding:16px 18px}.face{width:62px}.title{font-size:34px}.title.small{font-size:26px}.lead{font-size:9px;line-height:1.7}.btn{padding:12px 22px}.score{font-size:16px}}
@media (prefers-reduced-motion:reduce){.face,.prize{animation:none}}
</style>

<canvas id="game" aria-label="Super Wisam Spielfeld"></canvas>

<div class="controls" id="controls" hidden>
  <div class="pad">
    <button class="cbtn" id="bL" aria-label="Nach links">◀</button>
    <button class="cbtn" id="bR" aria-label="Nach rechts">▶</button>
  </div>
  <button class="cbtn jump" id="bJ" aria-label="Springen">HOPP</button>
</div>
<button class="mute" id="mute" aria-label="Ton an oder aus">♪</button>

<div class="overlay" id="ovStart">
  <div class="card">
    <img class="face" id="faceImg" src="__FACE__" alt="Wisam">
    <h1 class="title">SUPER<br>WISAM</h1>
    <p class="lead">Sammle Flaschen, spring den Gegnern auf den Kopf und schaff es bis in den Himmel.</p>
    <div class="btns"><button class="btn" id="startBtn">LEVEL 1</button><button class="btn" id="start2Btn">LEVEL 2</button></div>
    <p class="keys" id="keyHint">Pfeiltasten laufen · Leertaste springt</p>
  </div>
</div>

<div class="overlay" id="ovEnd" hidden>
  <div class="card">
    <div class="podium"><img class="face" src="__FACE__" alt="Wisam"><img class="prize" id="endPrize" alt="Siegerpreis: Schoko-Milch-Riegel"></div>
    <h2 class="title small" id="endTitle">GESCHAFFT!</h2>
    <p class="score" id="endScore">0 / 0</p>
    <p class="lead" id="endText"></p>
    <div class="btns"><button class="btn" id="nextBtn" hidden>LEVEL 2</button><button class="btn" id="againBtn">NOCHMAL</button></div>
  </div>
</div>

<script>
(() => {
const TS = 32, ROWS = 14, W = 176, GOAL_X = 166 * TS;
const GAPS1 = [[28,29],[62,64],[104,105],[140,142]], GAPS2 = [[24,25],[54,56],[96,98],[118,119],[140,142]];
let level = 1, levelT = 0;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const face = document.getElementById('faceImg');
const touch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const PIX = '"Press Start 2P", ui-monospace, monospace';
const DISP = 'Bungee, Impact, "Arial Black", sans-serif';

const L2 = () => level === 2;
let grid, bottles, enemies, popups, particles, bumps, total, got, lives, checkpoint, state = 'title', winT = 0;
let camX = 0, time = 0;
const PRICES = ['999 лв', '1.499 лв', '2.222 лв', '777 лв', '3.333 лв'];
const SAYS = ['Добра цена!', 'Внос Германия!', 'Без ръжда!', 'Top Zustand!', 'Nur heute!', 'Като нова!'];
const p = { w: 22, h: 54 };

/* ---------- Level ---------- */
function buildLevel() {
  grid = Array.from({ length: ROWS }, () => Array(W).fill('.'));
  bottles = []; enemies = []; popups = []; particles = []; bumps = new Map();
  let crates = 0;
  const GAPS = L2() ? GAPS2 : GAPS1;
  const inGap = x => GAPS.some(([a, b]) => x >= a && x <= b);
  for (let x = 0; x < W; x++) if (!inGap(x)) { grid[12][x] = '#'; grid[13][x] = '#'; }
  const S = (x, y, c) => { grid[y][x] = c; if (c === 'C') crates++; };
  const bt = (x, y) => bottles.push({ x: x * TS + 9, y: y * TS + 3, w: 14, h: 26, taken: false, ph: x * 0.7 });
  const barrel = (x, h) => { for (let i = 0; i < h; i++) S(x, 11 - i, 'K'); bt(x, 11 - h); };
  const stair = (x, h) => { for (let i = 0; i < h; i++) S(x, 11 - i, 'S'); };
  const plat = (a, b, y) => { for (let x = a; x <= b; x++) S(x, y, '='); };
  const row = (x, y, s) => [...s].forEach((c, i) => S(x + i, y, c));
  const en = x => {
    const i = enemies.length;
    if (L2()) enemies.push({ x: x * TS + 3, y: 12 * TS - 50, w: 26, h: 50, vx: 0, vy: 0, dir: -1, alive: true, gone: false, squash: 0, active: false, dealer: true, spd: 52 + (i % 3) * 12, price: PRICES[i % PRICES.length], say: SAYS[(i * 3) % SAYS.length], ph: i * 1.7 });
    else enemies.push({ x: x * TS + 3, y: 11 * TS + 6, w: 26, h: 26, vx: 0, vy: 0, dir: -1, alive: true, gone: false, squash: 0, active: false });
  };
  if (L2()) {
    bt(7, 10); bt(8, 10); bt(9, 10);
    row(11, 8, 'BCB'); bt(12, 5);
    barrel(17, 2); en(20);
    bt(23, 9); bt(24, 8); bt(25, 8); bt(26, 9);
    en(30); en(33);
    row(35, 8, 'BBCBB'); bt(37, 5);
    barrel(41, 3); en(45); barrel(48, 2);
    plat(50, 53, 8); bt(51, 7); bt(52, 7);
    bt(55, 8);
    en(59); en(62);
    for (let i = 0; i < 4; i++) stair(64 + i, i + 1); bt(67, 6);
    en(71); row(73, 8, 'BCBCB'); en(76); bt(75, 6);
    plat(80, 84, 8); bt(81, 7); bt(83, 7); en(82);
    plat(86, 89, 5); bt(87, 4); bt(88, 4);
    en(92); barrel(94, 2);
    bt(96, 8); bt(97, 7); bt(98, 8);
    row(101, 8, 'BCBCB'); en(101); en(104); en(106);
    barrel(109, 3);
    plat(111, 115, 8); bt(112, 7); bt(114, 7); en(113);
    bt(118, 9); bt(119, 9);
    en(122); barrel(125, 2); en(128);
    row(130, 8, 'BCB'); en(133); en(136);
    plat(137, 139, 5); bt(138, 4);
    bt(141, 8); en(145); en(147);
    for (let i = 0; i < 8; i++) stair(150 + i, i + 1); stair(158, 8);
    bt(153, 7); bt(156, 4);
    bt(161, 10); bt(162, 10); bt(163, 10);
    total = bottles.length + crates;
    return;
  }

  bt(8, 10); bt(9, 10); bt(10, 10);
  row(12, 8, 'BBCBCB'); bt(15, 5);
  barrel(22, 2); en(25);
  bt(27, 9); bt(28, 8); bt(29, 8); bt(30, 9);
  barrel(33, 3); en(37); barrel(40, 4); en(44);
  plat(46, 50, 8); bt(47, 7); bt(48, 7); bt(49, 7); en(52);
  plat(53, 56, 5); bt(54, 4); bt(55, 4); en(58);
  bt(63, 9);
  for (let i = 0; i < 5; i++) stair(68 + i, i + 1); bt(72, 6);
  en(76);
  row(78, 8, 'BCBCBCB'); row(80, 5, 'BBB'); bt(81, 4);
  en(86); row(89, 8, 'BCB'); en(95); en(98);
  barrel(100, 2); bt(104, 9); bt(105, 9); barrel(108, 3);
  bt(112, 10); bt(114, 10); bt(116, 10); bt(118, 10); en(115);
  plat(120, 124, 8); bt(121, 7); bt(123, 7); en(123);
  plat(126, 129, 5); bt(127, 4); bt(128, 4);
  en(132); row(133, 8, 'BCB'); en(136);
  bt(141, 8); en(146);
  for (let i = 0; i < 8; i++) stair(150 + i, i + 1); stair(158, 8);
  bt(153, 7); bt(156, 4);
  bt(161, 10); bt(162, 10); bt(163, 10);
  total = bottles.length + crates;
}

function resetGame() {
  buildLevel(); levelT = 0;
  got = 0; lives = 3; checkpoint = 3; camX = 0;
  spawn();
}
function spawn() {
  Object.assign(p, { x: checkpoint * TS, y: 12 * TS - p.h, vx: 0, vy: 0, onGround: false, facing: 1, dead: false, deadT: 0, inv: checkpoint > 3 ? 1.6 : 0, coyote: 0, buf: 0, anim: 0 });
}

/* ---------- Physik ---------- */
const SOLID = new Set(['#', 'B', 'S', 'C', 'c', 'K']);
function solid(tx, ty) { if (tx < 0 || tx >= W) return true; if (ty < 0 || ty >= ROWS) return false; return SOLID.has(grid[ty][tx]); }
function oneway(tx, ty) { return ty >= 0 && ty < ROWS && tx >= 0 && tx < W && grid[ty][tx] === '='; }
function move(e, dt, onHead) {
  e.hitWall = false;
  e.x += e.vx * dt;
  const t0 = Math.floor(e.y / TS), t1 = Math.floor((e.y + e.h - 0.01) / TS);
  if (e.vx > 0) { const tx = Math.floor((e.x + e.w) / TS); for (let ty = t0; ty <= t1; ty++) if (solid(tx, ty)) { e.x = tx * TS - e.w; e.vx = 0; e.hitWall = true; break; } }
  else if (e.vx < 0) { const tx = Math.floor(e.x / TS); for (let ty = t0; ty <= t1; ty++) if (solid(tx, ty)) { e.x = (tx + 1) * TS; e.vx = 0; e.hitWall = true; break; } }
  const prevBottom = e.y + e.h;
  e.y += e.vy * dt; e.onGround = false;
  const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - 0.01) / TS);
  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h) / TS);
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty) || (oneway(tx, ty) && prevBottom <= ty * TS + 1)) { e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; break; }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / TS); let hit = -1, best = 1e9;
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { const d = Math.abs((tx + .5) * TS - (e.x + e.w / 2)); if (d < best) { best = d; hit = tx; } }
    if (hit >= 0) { e.y = (ty + 1) * TS; e.vy = 0; onHead && onHead(hit, ty); }
  }
}
const overlap = (a, b, m = 0) => a.x + m < b.x + b.w && a.x + a.w - m > b.x && a.y + m < b.y + b.h && a.y + a.h - m > b.y;

function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, life: .5 + Math.random() * .3, color }); }
}
function bump(tx, ty) {
  if (tx < 0 || tx >= W) return;
  const c = grid[ty][tx];
  if (c !== 'B' && c !== 'C' && c !== 'c' && c !== 'S') return;
  bumps.set(tx + ',' + ty, 0);
  if (c === 'C') {
    grid[ty][tx] = 'c'; got++;
    popups.push({ x: tx * TS + 9, y: ty * TS - 26, vy: -300, t: 0 });
    sfx('bottle');
  } else sfx('bump');
  for (const e of enemies) if (e.alive && e.active && Math.abs(e.y + e.h - ty * TS) < 3 && e.x + e.w > tx * TS && e.x < (tx + 1) * TS) squash(e);
}
function squash(e) {
  e.alive = false; e.squash = 0; sfx('stomp');
  if (e.dealer) { burst(e.x + 11, e.y + 30, '#ffffff', 4); burst(e.x + 11, e.y + 30, '#00966e', 4); burst(e.x + 11, e.y + 30, '#d62612', 4); }
  else burst(e.x + 13, e.y + 20, '#bfe6ff', 8);
}
function die(fell) {
  if (p.dead) return;
  p.dead = true; p.deadT = 0; p.vx = 0; p.vy = fell ? -200 : -650; lives--; sfx('hurt');
}

const keys = { left: false, right: false, jump: false };

function step(dt) {
  time += dt;
  for (const [k, t] of bumps) { if (t > .16) bumps.delete(k); else bumps.set(k, t + dt); }
  for (const q of popups) { q.t += dt; q.vy += 900 * dt; q.y += q.vy * dt; }
  popups = popups.filter(q => q.t < .55);
  for (const q of particles) { q.t += dt; q.vy += 500 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  particles = particles.filter(q => q.t < q.life);
  for (const b of bottles) if (b.taken && b.fade < 1) b.fade += dt * 4;

  if (state === 'title') return;

  if (p.dead) {
    p.deadT += dt; p.vy += 1800 * dt; p.y += p.vy * dt;
    if (p.deadT > 1.6) { if (lives > 0) spawn(); else { state = 'over'; showEnd(false); } }
  } else if (state === 'win') {
    winT += dt;
    p.vx = p.x < GOAL_X + 70 ? 120 : 0;
    if (p.vx === 0 && p.onGround && Math.floor(winT * 2.5) % 2 === 0) p.vy = -380;
    p.vy += 2100 * dt; move(p, dt);
    p.anim += dt * 14; p.facing = 1;
    if (winT > 2.2) { state = 'done'; showEnd(true); }
  } else if (state === 'play') {
    levelT += dt;
    const acc = p.onGround ? 1500 : 1000;
    if (keys.left && !keys.right) { p.vx -= acc * dt; p.facing = -1; }
    else if (keys.right && !keys.left) { p.vx += acc * dt; p.facing = 1; }
    else { const f = (p.onGround ? 1700 : 500) * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; }
    p.vx = Math.max(-220, Math.min(220, p.vx));
    p.coyote = p.onGround ? .09 : p.coyote - dt;
    p.buf -= dt;
    if (p.buf > 0 && p.coyote > 0) { p.vy = -760; p.buf = 0; p.coyote = 0; sfx('jump'); }
    p.vy += 2100 * dt;
    if (p.vy < 0 && !keys.jump) p.vy += 2600 * dt;
    p.vy = Math.min(p.vy, 900);
    move(p, dt, bump);
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    p.anim += dt * (Math.abs(p.vx) / 18);
    if (p.inv > 0) p.inv -= dt;
    if (p.y > ROWS * TS + 40) die(true);
    if (p.x > 90 * TS && checkpoint < 90) checkpoint = 90;

    for (const b of bottles) if (!b.taken && overlap(p, b, 2)) { b.taken = true; b.fade = 0; got++; burst(b.x + 7, b.y + 12, '#f0a43a', 10); sfx('bottle'); }

    for (const e of enemies) {
      if (!e.alive || !e.active) continue;
      if (overlap(p, e, 3)) {
        if (p.vy > 40 && p.y + p.h - e.y < 18) { squash(e); p.vy = keys.jump ? -640 : -440; }
        else if (p.inv <= 0) { die(false); break; }
      }
    }
    if (p.x > GOAL_X) { state = 'win'; winT = 0; sfx('win'); burst(p.x, p.y, '#c46bff', 30); }
  }

  for (const e of enemies) {
    if (e.gone) continue;
    if (!e.alive) { e.squash += dt; if (e.squash > 1) e.gone = true; continue; }
    if (!e.active) { if (e.x < camX + viewW + 48) e.active = true; else continue; }
    e.vx = e.dir * (e.spd || 48); e.vy += 2000 * dt;
    move(e, dt);
    if (e.hitWall) e.dir *= -1;
    if (e.y > ROWS * TS + 60) { e.alive = false; e.gone = true; }
  }

  const target = p.x + p.w / 2 - viewW * 0.42;
  camX += (target - camX) * Math.min(1, dt * 8);
  camX = Math.max(0, Math.min(W * TS - viewW, camX));
}

/* ---------- Ton ---------- */
let ac = null, muted = false;
function tone(f1, f2, dur, type = 'square', vol = .08, delay = 0) {
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function sfx(k) {
  if (!ac || muted) return;
  try {
    if (k === 'jump') tone(280, 620, .14, 'square', .05);
    else if (k === 'bottle') { tone(988, 988, .07, 'square', .05); tone(1318, 1318, .16, 'square', .05, .07); }
    else if (k === 'stomp') tone(260, 60, .14, 'triangle', .2);
    else if (k === 'bump') tone(150, 90, .08, 'triangle', .2);
    else if (k === 'hurt') tone(520, 70, .7, 'sawtooth', .06);
    else if (k === 'win') [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, f, .16, 'square', .05, i * .12));
  } catch (_) {}
}

/* ---------- Sprites ---------- */
function makeCanvas(w, h, s, draw) { const c = document.createElement('canvas'); c.width = w * s; c.height = h * s; const g = c.getContext('2d'); g.scale(s, s); draw(g); return c; }
const bottleSpr = makeCanvas(14, 26, 4, g => {
  g.fillStyle = '#0d0d0d'; g.fillRect(4.5, 0, 5, 3);
  g.fillStyle = '#161616'; g.fillRect(5, 2.5, 4, 5.5);
  g.beginPath(); g.moveTo(5, 7); g.lineTo(9, 7); g.lineTo(13, 10.5); g.lineTo(13, 24.5); g.quadraticCurveTo(13, 26, 11.5, 26); g.lineTo(2.5, 26); g.quadraticCurveTo(1, 26, 1, 24.5); g.lineTo(1, 10.5); g.closePath(); g.fill();
  g.fillStyle = '#f1ece0'; g.fillRect(2.2, 13, 9.6, 9);
  g.fillStyle = '#161616'; g.fillRect(3, 13.8, 8, .5); g.fillRect(3, 21.2, 8, .5);
  g.font = 'bold 5px Georgia, serif'; g.textAlign = 'center'; g.fillText('W', 7, 18.4);
  g.font = 'bold 2.2px Georgia, serif'; g.fillText('No.7', 7, 20.8);
  g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(2.4, 10.5, 1, 2); g.fillRect(2.4, 23, 1, 2); g.fillRect(5.6, 2.5, .7, 4.5);
});
const wallPat = (() => {
  const c = makeCanvas(96, 48, 1, g => {
    g.fillStyle = '#211b27'; g.fillRect(0, 0, 96, 48);

    ctx.strokeStyle = '#6a6278'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px + 2, base - 166); ctx.quadraticCurveTo(px + 152, base - 126, px + 302, base - 166); ctx.stroke();
    const fl = ['#f4f4f4', '#00966e', '#d62612'];
    for (let j = 0; j < 14; j++) {
      const t = (j + .5) / 14, fx = px + 2 + 300 * t, fy = base - 166 + 4 * 40 * t * (1 - t) * 1, sw = Math.sin(time * 3 + j + k) * 1.5;
      ctx.fillStyle = fl[j % 3]; ctx.beginPath(); ctx.moveTo(fx - 6, fy); ctx.lineTo(fx + 6, fy); ctx.lineTo(fx + sw, fy + 13); ctx.closePath(); ctx.fill();
    }
    const [txt, col] = L2NEON[k % L2NEON.length];
    ctx.font = 'bold 18px "Arial Black", Arial, sans-serif'; ctx.textAlign = 'center';
    const flick = (k % 4 === 1 && Math.sin(time * 11 + k) > .88) ? .3 : 1;
    ctx.globalAlpha = zf * flick; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = col; ctx.fillText(txt, px + 152, base - 206);
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(txt, px + 152, base - 206);
    ctx.globalAlpha = zf * .55; ctx.textAlign = 'start';
    drawCar(px + 30, base - 40, ['#7a2f2f', '#2f4f7a', '#8a8a92', '#2f6a4a'][k % 4], k);
    drawCar(px + 190, base - 40, ['#c9c9cf', '#5a2f6a', '#1f1f24', '#9a6a2a'][k % 4], k + 2);
    ctx.globalAlpha = zf;
  }
  ctx.restore();
}
function drawBackground() {
  if (L2()) { drawCity(); drawSkyOverlay(); return; }
  ctx.fillStyle = '#211b27'; ctx.fillRect(0, 0, viewW, viewH);
  ctx.save(); ctx.translate(-((camX * .5) % 96), 0); ctx.fillStyle = wallPat; ctx.fillRect(0, 0, viewW + 96, viewH); ctx.restore();
  // Neonschilder (Parallaxe)
  ctx.save(); ctx.font = `20px ${DISP}`; ctx.textAlign = 'center';
  for (let i = 0; i < 14; i++) {
    const nx = i * 380 + 220 - camX * .5;
    if (nx < -150 || nx > viewW + 150) continue;
    const [txt, col] = NEON[i % NEON.length], ny = 70 + (i * 53 % 90);
    const flick = (i === 2 && Math.sin(time * 13) > .85) ? .25 : 1;
    const zf = 1 - Math.max(0, Math.min(1, (camX + viewW - 147 * TS) / (8 * TS)));
    if (zf <= 0) continue;
    ctx.globalAlpha = flick * zf; ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.fillStyle = col; ctx.fillText(txt, nx, ny);
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(txt, nx, ny);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawSkyOverlay();
}
function drawSkyOverlay() {
  // Lichtkegel
  const g = ctx.createLinearGradient(0, 0, 0, viewH);
  g.addColorStop(0, 'rgba(8,5,12,.55)'); g.addColorStop(.5, 'rgba(8,5,12,0)'); g.addColorStop(1, 'rgba(8,5,12,.25)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, viewW, viewH);
  // Wolken im Zielbereich
  const z = Math.max(0, Math.min(1, (camX + viewW - 147 * TS) / (8 * TS)));
  if (z > 0) {
    ctx.save(); ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = `rgba(190,170,240,${.07 * z})`; ctx.fillRect(0, 0, viewW, viewH);
    for (let i = 0; i < 14; i++) {
      const cl = clouds[i % 3], sx = (147 * TS - camX) * .6 + i * 105 + ((time * 7 + i * 29) % 60) - 30, sy = 24 + (i * 47 % 150);
      if (sx < -130 || sx > viewW + 20) continue;
      ctx.globalAlpha = (.35 + (i % 3) * .12) * z; ctx.drawImage(cl, Math.round(sx), sy, cl.width * 2, cl.height * 2);
    }
    ctx.restore();
  }
}
function drawFloorClouds() {
  if (159 * TS - camX > viewW + 40) return;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  for (let i = 0, wx = 158 * TS; wx < W * TS + 40; wx += 30, i++) {
    const cl = clouds[(i * 2) % 3], w = cl.width * 2, h = cl.height * 2;
    ctx.drawImage(cl, Math.round(wx - w / 2 + Math.sin(time * 1.4 + i) * 2), Math.round(12 * TS - h * .5 + (i % 2) * 4), w, h);
  }
  ctx.restore();
}
function star(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y - s * 2); ctx.lineTo(x + s * .45, y - s * .45); ctx.lineTo(x + s * 2, y); ctx.lineTo(x + s * .45, y + s * .45); ctx.lineTo(x, y + s * 2); ctx.lineTo(x - s * .45, y + s * .45); ctx.lineTo(x - s * 2, y); ctx.lineTo(x - s * .45, y - s * .45); ctx.closePath(); ctx.fill(); }
function drawPrize() {
  const gx = GOAL_X, gy = 12 * TS;
  if (gx - camX > viewW + 200) return;
  let x = gx + 111, y = gy - 80 + Math.sin(time * 2) * 2;
  const won = state === 'win' || state === 'done';
  if (won) { const t = Math.min(1, winT / .6), e = t * (2 - t), tx = p.x + p.w / 2 - 24, ty = p.y - 42 - Math.abs(Math.sin(winT * 5)) * 3; x += (tx - x) * e; y += (ty - y) * e; }
  const rg = ctx.createRadialGradient(x + 24, y + 15, 2, x + 24, y + 15, 42);
  rg.addColorStop(0, 'rgba(200,230,255,.5)'); rg.addColorStop(1, 'rgba(200,230,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(x - 20, y - 28, 88, 86);
  ctx.drawImage(prizeSpr, Math.round(x), Math.round(y), 48, 30);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  for (let k = 0; k < 4; k++) { const a = time * 1.6 + k * 1.57, s = (Math.sin(time * 6 + k * 2) + 1) * .8 + .6; star(x + 24 + Math.cos(a) * 32, y + 14 + Math.sin(a * 1.3) * 18, s); }
  if (won && winT > .6) { ctx.font = `8px ${PIX}`; ctx.textAlign = 'center'; ctx.fillStyle = '#f0a43a'; ctx.fillText('SIEGERPREIS!', x + 24, y - 10); ctx.textAlign = 'start'; }
}

function drawGoal() {
  const gx = GOAL_X, gy = 12 * TS;
  if (gx - camX > viewW + 300) return;
  const lg = ctx.createLinearGradient(0, 0, 0, gy);
  lg.addColorStop(0, 'rgba(255,236,190,.22)'); lg.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.save(); ctx.font = `22px ${DISP}`; ctx.textAlign = 'center';
  const wf = Math.sin(time * 17) > .93 ? .35 : 1, wp = .75 + .25 * Math.sin(time * 2.2);
  ctx.globalAlpha = wf; ctx.shadowColor = '#ff7ad9'; ctx.shadowBlur = 18 * wp; ctx.fillStyle = '#ff7ad9';
  ctx.fillText('WILLKOMMEN IM HIMMEL', gx - 30, 64);
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,235,250,.9)'; ctx.fillText('WILLKOMMEN IM HIMMEL', gx - 30, 64);
  ctx.restore();
  ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(gx + 100, 0); ctx.lineTo(gx + 175, 0); ctx.lineTo(gx + 240, gy); ctx.lineTo(gx + 35, gy); ctx.closePath(); ctx.fill();
  // Regal mit Flaschen
  ctx.fillStyle = '#4a2f1a'; ctx.fillRect(gx + 10, gy - 150, 210, 6); ctx.fillRect(gx + 10, gy - 110, 210, 6);
  for (let i = 0; i < 12; i++) { ctx.globalAlpha = .85; ctx.drawImage(bottleSpr, gx + 16 + i * 17, gy - 176, 11, 26); ctx.drawImage(bottleSpr, gx + 22 + i * 17, gy - 136, 11, 26); }
  ctx.globalAlpha = 1;
  // Theke
  ctx.fillStyle = '#5a3418'; ctx.fillRect(gx + 40, gy - 44, 190, 44);
  ctx.fillStyle = '#7d4b24'; for (let i = 0; i < 9; i++) ctx.fillRect(gx + 46 + i * 21, gy - 36, 14, 34);
  ctx.fillStyle = '#c08a4e'; ctx.fillRect(gx + 34, gy - 50, 202, 8);
  // Hocker
  for (const sx of [gx + 20, gx + 250]) { ctx.fillStyle = '#2a2a30'; ctx.fillRect(sx + 6, gy - 26, 4, 26); ctx.fillStyle = '#c0392b'; ctx.fillRect(sx - 2, gy - 32, 20, 7); }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(15,10,20,.6)'; ctx.fillRect(8, 8, 122, 34);
  ctx.drawImage(bottleSpr, 16, 12, 14, 26);
  ctx.font = `12px ${PIX}`; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f0a43a';
  ctx.fillText(`${got}/${total}`, 38, 26);
  if (face.complete) for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < lives ? 1 : .2; ctx.drawImage(face, viewW - 60 / scale - 76 + i * 24, 10, 21, 28); }
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#15111a'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, Math.round(gameTop * dpr));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, viewW, viewH); ctx.clip();
  drawBackground();
  ctx.save(); ctx.translate(-Math.round(camX), 0);
  drawGoal();
  const c0 = Math.max(0, Math.floor(camX / TS) - 1), c1 = Math.min(W - 1, Math.ceil((camX + viewW) / TS) + 1);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = c0; tx <= c1; tx++) {
    const c = grid[ty][tx]; if (c === '.') continue;
    const bt = bumps.get(tx + ',' + ty);
    drawTile(c, tx, ty, tx * TS, ty * TS - (bt !== undefined ? Math.sin(Math.PI * bt / .16) * 7 : 0));
  }
  drawFloorClouds();
  for (const b of bottles) {
    if (b.x < camX - 40 || b.x > camX + viewW + 40) continue;
    if (b.taken) { if (b.fade < 1) { ctx.globalAlpha = 1 - b.fade; ctx.drawImage(bottleSpr, b.x, b.y - b.fade * 24, b.w, b.h); ctx.globalAlpha = 1; } continue; }
    ctx.drawImage(bottleSpr, b.x, b.y + Math.sin(time * 3 + b.ph) * 2, b.w, b.h);
  }
  for (const q of popups) { ctx.globalAlpha = Math.min(1, 2 - q.t * 3); ctx.drawImage(bottleSpr, q.x, q.y, 14, 26); ctx.globalAlpha = 1; }
  for (const e of enemies) if (!e.gone && (e.active || e.x < camX + viewW + 40)) drawEnemy(e);
  drawPlayer();
  drawPrize();
  for (const q of particles) { ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (state !== 'title') drawHUD();
  if (state === 'play' && levelT < 2.6) {
    const a = Math.min(1, (2.6 - levelT) / .6);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.font = `28px ${DISP}`; ctx.shadowColor = '#c46bff'; ctx.shadowBlur = 16; ctx.fillStyle = '#f0a43a';
    ctx.fillStyle = 'rgba(13,10,20,.6)'; ctx.fillRect(viewW / 2 - 130, viewH * .12, 260, 68);
    ctx.fillStyle = '#f0a43a'; ctx.fillText(`LEVEL ${level}`, viewW / 2, viewH * .12 + 34);
    ctx.shadowBlur = 0; ctx.font = `10px ${PIX}`; ctx.fillStyle = '#f4ede4';
    ctx.fillText(L2() ? 'DIE AUTOMEILE' : 'DIE KELLERBAR', viewW / 2, viewH * .12 + 56);
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Schleife ---------- */
let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts; acc += dt;
  while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; }
  render();
  requestAnimationFrame(frame);
}

/* ---------- Bildschirme ---------- */
const ovStart = document.getElementById('ovStart'), ovEnd = document.getElementById('ovEnd'), controls = document.getElementById('controls');
function endMessage(c, n) {
  if (c === n) return `Alle Flaschen! Wisam, du Legende.`;
  const r = c / n;
  if (r >= .7) return `Respekt, Wisam! Fast alles weggeräumt.`;
  if (r >= .3) return `Da geht noch was, Wisam.`;
  return `Wisam, geht's dir gut? Sonst nimmst du mehr mit.`;
}
function showEnd(won) {
  document.getElementById('endTitle').textContent = won ? 'GESCHAFFT!' : 'GAME OVER';
  document.getElementById('endScore').textContent = `${got} / ${total} Flaschen`;
  document.getElementById('endText').textContent = won ? endMessage(got, total) : (L2() ? 'Die Autohändler haben dich über den Tisch gezogen. Auf ein Neues?' : 'Die Eiswürfel haben gewonnen. Auf ein Neues?');
  const nb = document.getElementById('nextBtn'), ab = document.getElementById('againBtn');
  nb.hidden = !(won && level === 1); ab.classList.toggle('ghost', !nb.hidden);
  document.getElementById('endPrize').hidden = !won;
  ovEnd.hidden = false; controls.hidden = true;
  setTimeout(() => (nb.hidden ? ab : nb).focus(), 50);
}
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; return; } }
  try {
    if (ac.state !== 'running') ac.resume();
    const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
    src.buffer = b; src.connect(ac.destination); src.start(0);
  } catch (_) {}
}
['pointerdown', 'touchend', 'keydown'].forEach(t => addEventListener(t, () => { if (ac && ac.state !== 'running') unlockAudio(); }, true));
document.addEventListener('visibilitychange', () => { if (!document.hidden && ac && ac.state !== 'running') { try { ac.resume(); } catch (_) {} } });
function start(n) {
  if (n === 1 || n === 2) level = n;
  unlockAudio();
  resetGame(); state = 'play';
  ovStart.hidden = true; ovEnd.hidden = true; controls.hidden = !touch;
  for (const k in keys) keys[k] = false;
}
document.getElementById('startBtn').addEventListener('click', () => start(1));
document.getElementById('start2Btn').addEventListener('click', () => start(2));
document.getElementById('nextBtn').addEventListener('click', () => start(2));
document.getElementById('againBtn').addEventListener('click', () => start());
if (touch) document.getElementById('keyHint').textContent = 'Tipp: Handy quer halten für mehr Sicht';

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.classList.toggle('off', muted); muteBtn.blur(); });

/* ---------- Eingabe ---------- */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' };
addEventListener('keydown', e => {
  if ((e.code === 'Enter' || e.code === 'Space') && (!ovStart.hidden || !ovEnd.hidden)) { e.preventDefault(); if (!ovStart.hidden) start(1); else start(document.getElementById('nextBtn').hidden ? undefined : 2); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (k === 'jump' && !keys.jump) p.buf = .12;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function bindBtn(id, k) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} if (k === 'jump' && !keys.jump) p.buf = .12; keys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bL', 'left'); bindBtn('bR', 'right'); bindBtn('bJ', 'jump');
document.addEventListener('gesturestart', e => e.preventDefault());

document.getElementById('endPrize').src = prizeSpr.toDataURL();
resize(); resetGame();
const go = () => requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`12px ${PIX}`), document.fonts.load(`20px ${DISP}`)]).then(go, go); else go();
})();
</script>

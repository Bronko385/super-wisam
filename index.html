<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15111a">
<title>Super Wisam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap">
<style>
/* Layout: ein Vollbild-Canvas (Kellerbar bei Nacht), Touch-Tasten unten, Overlays mittig. Bewusst nur dunkles Theme. */
:root{
  --bg:#15111a; --wall:#2a2430; --neon:#c46bff; --amber:#f0a43a; --ink:#f4ede4; --muted:#b3a7bf; --panel:#1f1926;
  --f-display:'Bungee',Impact,'Arial Black',sans-serif;
  --f-pixel:'Press Start 2P',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:14px}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-pixel)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:grid;place-items:safe center;overflow-y:auto;padding:16px;background:rgba(10,7,14,.74);z-index:5}
.card{width:min(420px,100%);box-sizing:border-box;text-align:center;display:grid;gap:18px;justify-items:center;padding:28px 20px;background:var(--panel);border:2px solid var(--amber);box-shadow:0 0 0 4px var(--bg),0 0 44px rgba(196,107,255,.35)}
.face{width:104px;height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,11vw,56px);line-height:.95;color:var(--amber);text-shadow:0 0 18px rgba(196,107,255,.85),3px 3px 0 #5a2a7a;margin:0;text-wrap:balance}
.title.small{font-size:clamp(26px,8vw,38px)}
.lead{margin:0;font-size:11px;line-height:1.9;color:var(--ink);max-width:32ch}
.score{margin:0;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums}
.keys{margin:0;font-size:9px;line-height:1.9;color:var(--muted)}
.btn{font-family:var(--f-pixel);font-size:14px;padding:16px 26px;background:var(--amber);color:#1a1008;border:0;box-shadow:0 5px 0 #8a5a18;cursor:pointer}
.btns .btn{padding:14px 18px;font-size:12px}
.pad.cross{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:4px}
.pad.cross .cbtn{width:60px;height:60px;font-size:18px}
.pad.cross #bU{grid-area:1/2}.pad.cross #bL{grid-area:2/1}.pad.cross #bR{grid-area:2/3}.pad.cross #bD{grid-area:3/2}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn.ghost{background:transparent;color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--amber)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a18}
.btn:focus-visible,.cbtn:focus-visible,.mute:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:16px 22px calc(22px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:4}
.pad{display:flex;gap:16px}
.cbtn{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:2px solid rgba(244,237,228,.35);background:rgba(244,237,228,.10);color:var(--ink);font-size:24px;display:grid;place-items:center;touch-action:none;padding:0;font-family:var(--f-pixel)}
.cbtn.jump{width:92px;height:92px;border-color:var(--amber);background:rgba(240,164,58,.20);color:var(--amber);font-size:12px}
.cbtn.on{background:rgba(240,164,58,.5);border-color:var(--amber);color:var(--ink)}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;width:40px;height:40px;border-radius:50%;border:2px solid rgba(244,237,228,.3);background:rgba(21,17,26,.6);color:var(--ink);font-size:16px;cursor:pointer;padding:0}
.mute.off{color:var(--muted);text-decoration:line-through}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.prize{width:128px;height:auto;animation:bob 1.6s ease-in-out infinite reverse}
@media (max-height:520px){.prize{width:84px}.card{gap:10px;padding:16px 18px}.face{width:62px}.title{font-size:34px}.title.small{font-size:26px}.lead{font-size:9px;line-height:1.7}.btn{padding:12px 22px}.score{font-size:16px}}
@media (prefers-reduced-motion:reduce){.face,.prize{animation:none}}
</style>
</head>
<body>


<canvas id="game" aria-label="Super Wisam Spielfeld"></canvas>

<div class="controls" id="controls" hidden>
  <div class="pad" id="pad">
    <button class="cbtn" id="bU" aria-label="Nach oben" hidden>▲</button>
    <button class="cbtn" id="bL" aria-label="Nach links">◀</button>
    <button class="cbtn" id="bR" aria-label="Nach rechts">▶</button>
    <button class="cbtn" id="bD" aria-label="Nach unten" hidden>▼</button>
  </div>
  <button class="cbtn jump" id="bJ" aria-label="Springen">HOPP</button>
</div>
<button class="mute" id="mute" aria-label="Ton an oder aus">♪</button>

  if (n >= 1 && n <= 4) level = n;
  unlockAudio();
  document.getElementById('pad').classList.toggle('cross', L3());
  document.getElementById('bU').hidden = document.getElementById('bD').hidden = !L3();
  document.getElementById('bJ').textContent = L3() ? 'FEUER' : 'HOPP';
  resize();
  resetGame(); state = 'play';
  ovStart.hidden = true; ovEnd.hidden = true; controls.hidden = !touch;
  for (const k in keys) keys[k] = false;
}
document.getElementById('startBtn').addEventListener('click', () => start(1));
document.getElementById('start2Btn').addEventListener('click', () => start(2));
document.getElementById('start3Btn').addEventListener('click', () => start(3));
document.getElementById('start4Btn').addEventListener('click', () => start(4));
document.getElementById('nextBtn').addEventListener('click', () => start(level + 1));
document.getElementById('againBtn').addEventListener('click', () => start());
if (touch) document.getElementById('keyHint').textContent = 'Tipp: Handy quer halten für mehr Sicht';

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.classList.toggle('off', muted); muteBtn.blur(); });

/* ---------- Eingabe ---------- */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'jump' };
addEventListener('keydown', e => {
  if ((e.code === 'Enter' || e.code === 'Space') && (!ovStart.hidden || !ovEnd.hidden)) { e.preventDefault(); if (!ovStart.hidden) start(1); else start(document.getElementById('nextBtn').hidden ? undefined : level + 1); return; }
  let k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (k === 'up' && !L3()) k = 'jump';
  if (k === 'down' && !L3()) return;
  if (k === 'jump' && !keys.jump) p.buf = .12;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (!k) return; keys[k] = false; if (k === 'up' && !L3()) keys.jump = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function bindBtn(id, k) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} if (k === 'jump' && !keys.jump) p.buf = .12; keys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bL', 'left'); bindBtn('bR', 'right'); bindBtn('bJ', 'jump'); bindBtn('bU', 'up'); bindBtn('bD', 'down');
document.addEventListener('gesturestart', e => e.preventDefault());

document.getElementById('endPrize').src = prizeSpr.toDataURL();
resize(); resetGame();
const go = () => requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`12px ${PIX}`), document.fonts.load(`20px ${DISP}`)]).then(go, go); else go();
})();
</script>
